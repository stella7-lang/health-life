<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康生活小百科</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">🌱 健康生活小百科</a>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>健康生活小百科</h1>
      <p>給大學生的飲食、運動、睡眠小知識。每一頁 3 分鐘讀完，今天就能開始改變。</p>
    </section>

    <!-- 🥗 飲食 -->
    <section class="category diet">
      <h2>🥗 飲食</h2>
      <div class="card-grid">
        <a class="card" href="pages/diet-healthy-plate.html">
          <span class="tag tag-diet">🥗 飲食</span>
          <h3>外食族怎麼吃出均衡的一餐？</h3>
          <p>用拳頭和掌心估份量：菜跟飯一樣多，豆魚蛋肉一掌心。</p>
        </a>
      </div>
    </section>

    <!-- 🏃 運動 -->
    <section class="category exercise">
      <h2>🏃 運動</h2>
      <div class="card-grid">
        <a class="card" href="pages/exercise-break-sitting.html">
          <span class="tag tag-exercise">🏃 運動</span>
          <h3>久坐的大學生每天怎麼動起來？</h3>
          <p>少坐一點、多動一點：任何強度的活動都比一直坐著好。</p>
        </a>
      </div>
    </section>

    <!-- 😴 睡眠 -->
    <section class="category sleep">
      <h2>😴 睡眠</h2>
      <div class="card-grid">
        <a class="card" href="pages/sleep-basics.html">
          <span class="tag tag-sleep">😴 睡眠</span>
          <h3>大學生要睡多久才夠？</h3>
          <p>成年人每晚至少睡 7 小時，而且固定時間睡、固定時間起床。</p>
        </a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">健康生活小百科 · 生成式AI 課程作業</div>
  </footer>
